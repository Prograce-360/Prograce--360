name: PROGRACE 360 CI

on:
push:
branches:
- main
pull_request:
branches:
- main

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Verify authentication files
    run: |
      echo "=== Current commit ==="
      git rev-parse HEAD
      echo "=== Authentication files ==="
      git ls-files | grep -E '^src/lib/(auth|authentification)/' || true

  - name: Generate Prisma contract
    run: npm run contract:emit

  - name: Verify TypeScript
    run: npx tsc --noEmit

  - name: Build
    run: npm run build
