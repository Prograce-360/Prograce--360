name: PROGRACE 360 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify authentication files
        run: |
          pwd
          echo "=== src/lib ==="
          ls -la src/lib
          echo "=== src/lib/authentification ==="
          ls -la src/lib/authentification
          echo "=== Git tracked authentication files ==="
          git ls-files | grep '^src/lib/authentification/'

      - name: Generate Prisma contract
        run: npm run contract:emit

      - name: Build
        run: npm run build
